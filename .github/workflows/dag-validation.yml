# Parses the Airflow DAG so a broken import is caught before it reaches a
# scheduler. Manual-only, like every workflow in this repo.
name: dag-validation

on:
  workflow_dispatch:

  # pull_request:
  #   paths: ["dags/**", "src/**"]

permissions:
  contents: read

jobs:
  import-dag:
    name: import & lint DAG
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Airflow and the pipeline package
        run: |
          python -m pip install --upgrade pip
          pip install "apache-airflow==2.10.2" \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-2.10.2/constraints-3.11.txt"
          pip install -r requirements.txt
          pip install -e .

      - name: Import every DAG and assert it is paused on creation
        env:
          AIRFLOW__CORE__LOAD_EXAMPLES: "false"
          AIRFLOW__CORE__DAGS_FOLDER: ${{ github.workspace }}/dags
          RP_PROJECT_ROOT: ${{ github.workspace }}
        run: |
          python - <<'PY'
          from airflow.models import DagBag

          bag = DagBag(include_examples=False)
          assert not bag.import_errors, bag.import_errors

          # bag.dags avoids touching the metadata DB, which CI has not migrated.
          dag = bag.dags.get("rewards_medallion")
          assert dag is not None, "rewards_medallion not found"
          assert dag.is_paused_upon_creation is True, "DAG must ship paused"
          print(f"{len(bag.dags)} DAG(s) imported cleanly; tasks: {len(dag.tasks)}")
          PY
